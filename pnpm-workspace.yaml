packages:
  - packages/*
  - playground

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: false

overrides:
  '@types/eslint': '-'

catalogs:
  prod:
    '@antfu/install-pkg': ^2.1.0
    '@clack/prompts': ^1.8.1
    '@eslint/config-inspector': ^3.5.0
    '@eslint/js': ^10.0.1
    '@nuxt/devtools-kit': ^3.4.4
    '@nuxt/kit': ^4.5.1
    '@stylistic/eslint-plugin': ^5.10.0
    '@typescript-eslint/eslint-plugin': ^8.72.1
    '@typescript-eslint/parser': ^8.72.1
    '@typescript-eslint/scope-manager': ^8.72.1
    '@typescript-eslint/types': ^8.72.1
    '@typescript-eslint/utils': ^8.72.1
    chokidar: ^5.0.0
    eslint-config-flat-gitignore: ^2.4.0
    eslint-flat-config-utils: ^3.2.0
    eslint-merge-processors: ^2.0.0
    eslint-plugin-format: ^2.0.1
    eslint-plugin-import-lite: ^0.6.0
    eslint-plugin-import-x: ^4.17.1
    eslint-plugin-jsdoc: ^63.3.3
    eslint-plugin-n: ^18.5.0
    eslint-plugin-promise: ^7.3.0
    eslint-plugin-regexp: ^3.3.2
    eslint-plugin-unicorn: ^73.0.0
    eslint-plugin-vue: ^10.12.0
    eslint-processor-vue-blocks: ^2.0.0
    eslint-typegen: ^2.3.2
    eslint-webpack-plugin: ^6.0.0
    find-up: ^8.0.0
    get-port-please: ^3.2.0
    globals: ^17.13.0
    local-pkg: ^1.2.1
    mlly: ^1.8.2
    pathe: ^2.0.3
    unimport: ^6.5.0
    vite-plugin-eslint2: ^5.3.0
    vue-eslint-parser: ^10.4.1
    vue: ^3.5.44
  bundling:
    '@nuxt/module-builder': ^1.0.3
  types:
    '@types/node': ^26.6.6
    '@nuxt/nitro-server': ^4.5.1
    '@nuxt/schema': ^4.5.1
    nitropack: ^2.13.5
  dev:
    '@nuxt/test-utils': ^4.3.4
    bumpp: ^12.3.0
    eslint-plugin-pnpm: ^1.9.1
    eslint: ^10.13.0
    eslint-vitest-rule-tester: ^3.2.0
    jsonc-eslint-parser: ^3.3.0
    nuxt: ^4.5.1
    taze: ^19.17.2
    typescript: ^6.0.3
    unbuild: ^3.6.1
    vitest: ^4.1.10

update:
  ignoreDeps:
    - typescript@7
